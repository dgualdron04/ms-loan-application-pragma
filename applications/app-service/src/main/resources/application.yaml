server:
  port: 8081
spring:
  application:
    name: "ms-loan-application"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
logging:
  level:
    root: "INFO"
    co.com.pragma: "DEBUG"
    org.springframework.r2dbc: "WARN"
    io.r2dbc.postgresql.QUERY: "INFO"
    io.r2dbc.postgresql.PARAM: "WARN"
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "crediya_loan_db"
    schema: "public"
    username: "crediya"
    password: "crediya2025"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  paths:
    loans: "/api/v1/solicitud"
adapter:
  restconsumer:
    timeout: 3000
    url: "http://localhost:8080"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
jwt:
  secret: "GKU2sCyjHN2D4KXdLKsxRn3UDKI1TjTdP3pxzMzfIE8="
  expiration: 3600
  jws-algorithms: HS256